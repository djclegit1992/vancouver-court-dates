name: scrape

# Three-layer trigger.
#
#   workflow_dispatch  cron-job.org POSTs here. This is the PRIMARY.
#                      Dispatched runs start immediately rather than
#                      queueing behind GitHub's shared scheduler, and
#                      cron-job.org's schedules are timezone-aware, so
#                      daylight saving stops being our problem.
#
#   schedule           BACKUP only, 30 minutes behind each primary slot.
#                      GitHub's scheduled workflows are best-effort and
#                      are sometimes dropped entirely. Never rely on
#                      this as the primary. Times are UTC and do NOT
#                      shift with Pacific daylight saving, which is
#                      exactly why it is the backup.
#
#   healthchecks.io    Watchdog. Success pings only, no /start and no
#                      /fail, so a single dropped connection does not
#                      raise an alarm. Configure the check in CRON mode
#                      with '15 8-17 * * *' and timezone
#                      America/Vancouver, so it expects a ping after
#                      each scheduled run and stays quiet overnight.
#                      A period-based check would alarm every night,
#                      because there is a 15 hour gap with no runs.
#                      This is the layer that protects alert
#                      subscribers: a silently dead pipeline is the
#                      failure that actually does damage.
#
# The skip guard in scrape.py means the backup exits in seconds if the
# primary already ran. Manual and dispatched runs force through it.

on:
  workflow_dispatch:
    inputs:
      alerts_dry_run:
        description: 'Work out who would be emailed, but send nothing'
        type: boolean
        default: false
  schedule:
    # Thirty minutes behind each cron-job.org slot, which runs hourly
    # at :15 past from 08:15 to 17:15 Pacific.
    #
    # The court rebuilds all 28 availability lists every hour on the
    # hour at about :03 past, during business hours. Measured, not
    # assumed: consecutive rebuilds were 59 minutes 33 seconds and 59
    # minutes 32 seconds apart, with a 16 hour overnight gap.
    #
    # These are UTC and do NOT shift with Pacific daylight saving,
    # which is precisely why cron-job.org is the primary trigger and
    # this is only the backup.
    - cron: '45 15-23 * * *'   # 08:45 to 16:45 PT
    - cron: '45 0 * * *'       # 17:45 PT

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose TLS chain
        # bccourts.ca appears to omit an intermediate certificate.
        # Windows hides this by fetching it via AIA; OpenSSL does not.
        # Non-fatal: this only reports what the server presents.
        continue-on-error: true
        run: python diagnose_tls.py

      - name: Run tests
        # Fast and offline. If the diff logic is broken we would rather
        # fail here than publish wrong data, and if the alert matching
        # is broken we would rather fail here than email someone.
        run: |
          python test_scrape.py
          python test_alerts.py data/raw

      - name: Scrape
        id: scrape
        env:
          # A dispatched run is the primary and must not be skipped.
          # A scheduled run is the backup and should defer to the guard.
          FORCE_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: python scrape.py

      - name: Commit data
        run: |
          git config user.name  "courtready-bot"
          git config user.email "admin@courtready.ca"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Another run may have pushed while we worked, so retry.
            # If all three attempts fail the job MUST fail: a scrape
            # that reports success while publishing nothing is the
            # silent failure this whole project exists to avoid.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash; then
                if git push; then
                  pushed=1
                  break
                fi
              fi
              echo "push attempt $i failed"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::could not push scraped data after 3 attempts"
              exit 1
            fi
          fi

      # After the commit, deliberately. The scraped data is the durable
      # asset and must be saved whatever happens to the email layer. If
      # sending fails, the job goes red and the data is still safe.
      #
      # alerts.py exits quietly when its credentials are absent, so this
      # step is harmless until the secrets are set.
      - name: Send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          POSTMARK_FROM: ${{ secrets.POSTMARK_FROM }}
          POSTMARK_STREAM: ${{ secrets.POSTMARK_STREAM }}
          ALERTS_DRY_RUN: ${{ github.event.inputs.alerts_dry_run == 'true' && '1' || '0' }}
        run: python alerts.py

      - name: Report repository size
        # Early warning if the archive starts growing faster than
        # expected. A repo nobody can clone is a dead repo.
        run: |
          echo "data/      $(du -sh data 2>/dev/null | cut -f1)"
          echo "data/raw   $(du -sh data/raw 2>/dev/null | cut -f1)"
          echo "archived   $(find data/raw -type f 2>/dev/null | wc -l) files"

      - name: Signal success
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || true

      # No /fail ping, deliberately.
      #
      # bccourts.ca occasionally drops a connection: one run timed out
      # three times at 45 seconds and the next hour was clean. Pinging
      # /fail would email on every such blip, and an alarm that fires on
      # noise gets muted, which defeats the point of having a watchdog.
      #
      # Staying silent instead lets the grace window do the work. One
      # failure is absorbed; several consecutive hours with no success
      # ping trips the alarm, which is the condition actually worth
      # knowing about. The run still shows red in Actions either way,
      # so nothing is hidden.

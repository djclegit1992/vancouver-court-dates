name: diag-probe

# Diagnostic only. Lives on the diag/court-probe branch and never on main.
# Each push to that branch runs three probes in parallel on three
# separate GitHub machines (usually three different IP addresses), and
# commits their reports to diag/ on the same branch. Does not touch
# data/, does not publish, does not send alerts.

on:
  push:
    branches: [diag/court-probe]

permissions:
  contents: write

concurrency:
  group: diag-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        label: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -qq dnsutils whois traceroute > /dev/null 2>&1 || true
      - name: Probe
        env:
          PROBE_LABEL: ${{ matrix.label }}
          SKIP_TLS_CHECK: '0'
        run: |
          mkdir -p diag
          python -u diag_probe.py 2>&1 | tee "diag/${{ matrix.label }}-$(date -u +%H%M).txt"
      - name: Save report
        if: always()
        run: |
          git config user.name  "courtready-bot"
          git config user.email "admin@courtready.ca"
          git add diag/
          git commit -m "diag: probe ${{ matrix.label }}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && break
            sleep $((RANDOM % 7 + 2))
          done

name: diag-probe

# Diagnostic only. Lives on the diag/court-probe branch, never on main.

on:
  push:
    branches: [diag/court-probe]

permissions:
  contents: write

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch intermediate
        run: |
          mkdir -p diag
          python -u diag_cert.py 2>&1 | tee diag/intermediate.txt
      - name: Save
        if: always()
        run: |
          git config user.name  "courtready-bot"
          git config user.email "admin@courtready.ca"
          git add diag/
          git commit -m "diag: intermediate certificate" || exit 0
          git pull --rebase -q && git push -q
